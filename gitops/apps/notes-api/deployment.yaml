apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  labels: { app: notes-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: notes-api }
  template:
    metadata:
      labels: { app: notes-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: notes-api
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: aws-eks
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notes-db          # created by scripts/03-migrate-db.sh (stretch: External Secrets)
                  key: DATABASE_URL
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: notes-api }
