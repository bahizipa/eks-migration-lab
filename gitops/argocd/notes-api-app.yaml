apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the App deletes the resources (and the NLB)
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_GITOPS_REPO_URL      # scripts/02-bootstrap-argocd.sh patches this
    targetRevision: main
    path: gitops/apps/notes-api
  destination:
    server: https://kubernetes.default.svc
    namespace: notes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
